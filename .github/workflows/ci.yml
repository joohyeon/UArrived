name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Jac
        run: pip install jaclang
      - name: Format
        run: jac fmt --check .
      - name: Type check
        run: jac check .
      - name: Tests
        run: |
          files=$(git ls-files '*.jac')
          [ -z "$files" ] || jac test $files
