name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repo rules (Jac share, boundaries, design tokens)
        run: bash scripts/check_rules.sh
      # Hackathon speed mode: fmt/type-check/tests are no longer required in CI.
      # Run them locally when you want the extra confidence: jac fmt --check ., jac check .,
      # jac test -d . (see README.md). Restore the full pipeline post-hackathon.
